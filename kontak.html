        background: linear-gradient(135deg, #1e3c72, #2a5298);

    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        max-width: 700px;
        margin: auto;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);

    h1 {
        text-align: center;
        color: #2a5298;
    }

    .kontak-item {
        font-size: 18px;
        margin: 15px 0;
    }

    .kontak-item i {
        margin-right: 10px;
        color: #2a5298;
    }

    a {
        text-decoration: none;
        color: #2a5298;
    }

    a:hover {
        color: #00c6ff;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>

</head>
