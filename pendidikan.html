<!DOCTYPE html>
<html>
<head>
<title>Pendidikan</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    max-width: 700px;
    margin: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 0.8s ease;
}

h1 {
    text-align: center;
    color: #2a5298;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #2a5298;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ccc;
}

tr:hover {
    background: #f1f1f1;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>

</head>

<body>

<div class="card">
    <h1>RIWAYAT PENDIDIKAN</h1>

    <table>
        <tr>
            <th>No</th>
            <th>Lembaga</th>
        </tr>

        <tr><td>1</td><td>SD Karawang Wetan III</td></tr>
        <tr><td>2</td><td>SMP YPI Pasawahan</td></tr>
        <tr><td>3</td><td>SMA MA K ALMA</td></tr>
        <tr><td>4</td><td>Universitas Halim Sanusi - Teknik Informatika</td></tr>
    </table>
</div>

</body>
</html>
