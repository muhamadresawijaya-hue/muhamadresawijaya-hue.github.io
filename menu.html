<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(180deg, #1e3c72, #2a5298);
        color: white;
    }

    .menu {
        padding: 20px;
    }

    .menu h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .menu a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        margin: 10px 0;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        text-decoration: none;
        color: white;
        transition: 0.3s;
    }

    .menu a:hover {
        background: #00c6ff;
        transform: translateX(5px);
    }

    .menu i {
        width: 20px;
        text-align: center;
    }

    .menu a:active {
        transform: scale(0.95);
    }
</style>

</head>

<body>

<div class="menu">
    <h2>MENU</h2>

    <a href="home.html" target="konten">
        <i class="fa-solid fa-user"></i> Home
    </a>

    <a href="hobby.html" target="konten">
        <i class="fa-solid fa-futbol"></i> Hobby
    </a>

    <a href="pendidikan.html" target="konten">
        <i class="fa-solid fa-graduation-cap"></i> Pendidikan
    </a>

    <a href="kontak.html" target="konten">
        <i class="fa-solid fa-phone"></i> Kontak
    </a>

</div>

</body>
</html>
